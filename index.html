function currentPerson(){return state.members.find(p=>p.id===ui.person)||state.members[0]}
function choice(){return state.active?.choices.find(c=>c.memberId===currentPerson().id)}
function dishNames(ids){return ids.map(id=>state.recipes.find(r=>r.id===id)?.name).filter(Boolean).join('、')}
function currentTitle(){const h=new Date().getHours();return new Date().toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'})+(h<10?' 早餐':h<15?' 午饭':' 晚饭')}
function date(value){const d=new Date(value);return Number.isNaN(d.getTime())?'日期未记录':d.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'})}
function emoji(r){return /汤/.test(r.name+r.category)?'🥣':/鱼/.test(r.name)?'🐟':/肉|荤/.test(r.name+r.category)?'🍲':/蛋|番茄/.test(r.name)?'🍅':'🥬'}
function art(r,thumb=false){return r.photo?`<img src="${esc(r.photo)}" alt="${esc(r.name)}" ${thumb?'':'loading="lazy"'}>`:`<span class="emoji" aria-hidden="true">${emoji(r)}</span>`}
function renderSaveLabel(){const el=$('saveState');if(el){el.textContent=saveLabel;el.className='save-state'+(saveLabel.includes('失败')?' failed':'')}}
function render(){
  if(!state)return;
  const content=fatal?`<h1>存档需要检查</h1><p class="tip">${esc(fatal)}。原存档尚未覆盖，请从备份恢复。</p><button class="primary" data-action="import">导入备份</button>`:ui.tab==='menu'?menu():ui.tab==='meal'?mealView():ui.tab==='history'?history():library();
  $('app').innerHTML=`<header><div class="brand"><span class="seal" aria-hidden="true">家</span><div><strong>家常饭</strong><small>一家人，轮流点喜欢的菜</small></div></div><span class="tag">${window.FAMILY_NATIVE?'iPhone 本地版':'手机网页版'}</span></header><main>${content}<div id="saveState" class="save-state">${esc(saveLabel)}</div></main><nav class="bottom-nav" aria-label="主要页面">${[['menu','菜单','♧'],['meal','本顿饭','♨'],['history','历史','◷'],['library','菜品','▤']].map(([tab,name,icon])=>`<button class="nav-item ${ui.tab===tab?'active':''}" data-action="tab" data-tab="${tab}" ${ui.tab===tab?'aria-current="page"':''}><span aria-hidden="true">${icon}</span>${name}</button>`).join('')}</nav>`;
}
function menu(){const m=state.active,p=currentPerson(),c=choice();return`<div class="eyebrow">把想吃的，告诉做饭的人</div><h1>今天，想吃什么？</h1><p class="subtitle">把手机递给家人，每个人都能选一份自己的心意。</p>${!m?`<div class="start-panel"><div><h2>准备下一顿家常饭</h2><p>先开始一顿饭，再让大家轮流选菜。</p></div><button class="primary" data-action="start">开始点菜 ↗</button></div>`:`<div class="meal-strip"><div><h2>${esc(m.title)}</h2><p>${m.phase==='open'?'正在收集大家想吃的菜':'最终菜单已确认，可以开火啦'}</p></div><button class="text-btn" data-action="tab" data-tab="meal">${m.phase==='open'?'主厨查看':'查看菜单'} →</button></div>${m.phase==='open'?`<div class="person row spread"><div><small>当前点菜人</small><br><strong>${esc(p.name)}</strong> <span class="quiet">${c?.submitted?'已选好，可继续修改':''}</span></div><button class="text-btn" data-action="person">换个人 / 添加家人 →</button></div>`:''}`}<input class="search" id="search" aria-label="搜索菜名或食材" placeholder="搜索菜名或食材" value="${esc(ui.search)}"><div class="filters" aria-label="菜品分类">${['全部',...new Set(state.recipes.map(r=>r.category))].map(cat=>`<button class="filter ${ui.category===cat?'active':''}" data-action="category" data-category="${esc(cat)}">${esc(cat)}</button>`).join('')}</div><div id="dishGrid">${grid()}</div>${m?.phase==='open'?`<div class="selection-bar"><div><strong>${esc(p.name)} · 已选 ${c?.dishes.length||0} 道</strong><p>${esc(c?.dishes.length?dishNames(c.dishes):'点击菜品就能选中')}</p></div><button class="primary" data-action="submit">我选好了，换下一位</button></div>`:''}`}
function grid(){const list=state.recipes.filter(r=>(ui.category==='全部'||r.category===ui.category)&&(r.name+r.ingredients).toLowerCase().includes(ui.search.toLowerCase()));return list.length?`<div class="dish-grid">${list.map(r=>`<button class="dish ${choice()?.dishes.includes(r.id)?'chosen':''}" data-action="dish" data-id="${esc(r.id)}" aria-pressed="${!!choice()?.dishes.includes(r.id)}"><div class="dish-photo">${art(r)}${r.example?'<span class="example">示例菜</span>':''}${state.active?.phase==='open'?`<span class="check" aria-hidden="true">${choice()?.dishes.includes(r.id)?'✓':'+'}</span>`:''}</div><div class="dish-copy"><small>${esc(r.category)}</small><h3>${esc(r.name)}</h3><p>${esc(r.note||r.ingredients||'我的拿手菜')}</p></div></button>`).join('')}</div>`:`<div class="empty"><p>${state.recipes.length?'没有找到这道菜':'你的菜单还空着，先添加一道拿手菜吧'}</p><button class="secondary" data-action="editRecipe">添加菜品</button></div>`}
function mealView(){const m=state.active;if(!m)return`<div class="eyebrow">今晚的期待，从这里开始</div><h1>本顿饭</h1><div class="empty"><span class="emoji-line" aria-hidden="true">🥢</span><p>现在没有正在安排的饭</p><button class="primary" data-action="start">开始一顿饭</button></div>`;const choices=m.choices.filter(c=>c.dishes.length);if(ui.finalIds===null)ui.finalIds=m.phase==='confirmed'?m.final.map(r=>r.id):[...new Set(choices.flatMap(c=>c.dishes))];return`<div class="eyebrow">主厨来决定</div><h1>${esc(m.title)}</h1><p class="subtitle">家人表达想吃的心意，最后做哪些菜由你决定。</p>${m.phase==='confirmed'?`<div class="notebook"><span class="eyebrow">这顿饭，吃这些</span><h2>最终菜单</h2><ol class="final-list">${m.final.map(r=>`<li>${esc(r.name)}</li>`).join('')}</ol></div><div class="row"><button class="secondary" data-action="copyMenu">复制菜单文字</button><button class="primary" data-action="finishAsk">结束这顿饭，保存历史</button></div>`:''}<div class="section-heading"><h2>大家分别想吃什么</h2><button class="text-btn" data-action="tab" data-tab="menu">回菜单 →</button></div>${choices.length?choices.map(c=>`<article class="person-card"><div class="row spread"><h3>${esc(state.members.find(p=>p.id===c.memberId)?.name||'家人')}</h3><span class="status ${c.submitted?'done':''}">${c.submitted?'已选好':'正在选择'}</span></div><p>${esc(dishNames(c.dishes))}</p></article>`).join(''):'<p class="tip">还没有人选菜。也可以由你直接搭配下面的最终菜单。</p>'}<div class="section-heading"><h2>${m.phase==='confirmed'?'调整最终菜单':'这顿饭，准备做哪些？'}</h2><span class="quiet">已选 ${ui.finalIds.length} 道</span></div><div class="choice-chips">${[...m.final.filter(r=>!state.recipes.some(x=>x.id===r.id)),...state.recipes].map(r=>`<button class="choice-chip ${ui.finalIds.includes(r.id)?'active':''}" aria-pressed="${ui.finalIds.includes(r.id)}" data-action="finalDish" data-id="${esc(r.id)}">${ui.finalIds.includes(r.id)?'✓ ':''}${esc(r.name)}</button>`).join('')}</div><div class="row" style="margin-top:22px"><button class="primary" data-action="confirm">${m.phase==='confirmed'?'保存菜单调整':'确定最终菜单'}</button></div><p class="tip">确认后停止本轮点菜；结束后，最终菜单会留在历史里。</p>`}
function history(){return`<div class="eyebrow">把每一顿饭，好好留住</div><h1>过去的家常味</h1><p class="subtitle">记录已经结束的饭，保留当时确定的菜名。</p><div style="margin-top:25px">${state.history.length?state.history.map(m=>`<article class="history-card"><small>${esc(date(m.finishedAt))} · ${m.final.length} 道菜</small><h2>${esc(m.title)}</h2><p>${esc(m.final.map(r=>r.name).join(' · '))}</p><button class="text-btn" data-action="copyHistory" data-id="${esc(m.id)}">复制菜单文字 →</button></article>`).join(''):'<div class="empty"><span class="emoji-line" aria-hidden="true">📒</span><p>第一顿饭结束后，就会在这里留下记录。</p></div>'}</div>`}
function library(){return`<div class="eyebrow">会做的菜，慢慢攒成一本</div><div class="manage-header"><h1>我的拿手菜</h1><button class="primary" data-action="editRecipe">＋ 添加</button></div><p class="subtitle">照片、菜名和分类记在这里，制作步骤留给手写笔记。</p><div style="margin-top:25px">${state.recipes.map(r=>`<article class="library-row"><div class="thumb">${art(r,true)}</div><div class="library-copy"><h3>${esc(r.name)}</h3><p>${esc(r.category)} · ${esc(r.difficulty)}${r.example?' · 示例':''}</p></div><button class="secondary" data-action="editRecipe" data-id="${esc(r.id)}">编辑</button></article>`).join('')||'<div class="empty">还没有菜品，添加第一道吧。</div>'}</div><div class="panel" style="margin-top:25px"><h2 style="font-size:17px;margin-bottom:8px">给这本菜单留一份备份</h2><p class="tip">导出包含照片、家人的选择和历史菜单。换设备或清理数据前，先把备份保存到“文件”。</p><div class="backup-grid"><button class="secondary" data-action="export">导出完整备份</button><button class="secondary" data-action="import">从备份恢复</button></div></div><p class="tip">菜品和记录保存在当前浏览器。请固定用同一浏览器打开这个网址，并收藏它；微信、Safari 或另一部手机的数据可能不同。清理浏览器数据前请先备份。示例菜可以编辑、换照片或删除。</p>`}
function showModal(html){const m=$('modal');m.innerHTML=html;if(!m.open)m.showModal();m.scrollTop=0}
function closeModal(){if($('modal').open)$('modal').close();ui.editing=null}
function actions(primary,label='确定'){return`<div class="dialog-actions"><button class="secondary" data-action="close">取消</button><button class="primary" data-action="${primary}">${label}</button></div><p id="modalError" class="modal-error" role="alert"></p>`}
function modalError(message){const p=$('modalError');if(p)p.textContent=message;else toast(message)}
function startDialog(){showModal(`<h2>开始一顿家常饭</h2><p class="tip">每次只安排一顿饭，让家人轮流拿手机选菜。</p><label for="mealTitle">这顿饭叫什么</label><input id="mealTitle" maxlength="50" value="${esc(currentTitle())}">${actions('doStart','开始点菜')}`)}
function personDialog(){showModal(`<h2>现在轮到谁点菜？</h2><div class="member-list">${state.members.map(p=>`<button class="${p.id===ui.person?'selected':''}" data-action="choosePerson" data-id="${esc(p.id)}">${esc(p.name)}</button>`).join('')}</div><label for="newPerson">或者添加一位家人</label><input id="newPerson" maxlength="20" placeholder="例如：妈妈、小林">${actions('addPerson','添加并开始选菜')}`)}
function editDialog(id){const r=clone(state.recipes.find(r=>r.id===id)||{id:'',name:'',category:'家常小炒',ingredients:'',note:'',difficulty:'简单',photo:''});ui.editing=r;showModal(`<h2>${id?'编辑拿手菜':'新添一道拿手菜'}</h2><div class="photo-edit"><div class="thumb" id="editPhoto">${art(r,true)}</div><div><button class="secondary" data-action="pickPhoto">选择本机照片</button><br><button class="text-btn quiet" data-action="removePhoto">移除照片</button></div></div><p class="photo-name">照片会压缩后保存在本机。</p><label for="dishName">菜名 *</label><input id="dishName" maxlength="40" value="${esc(r.name)}" placeholder="例如：可乐鸡翅"><div class="field-row"><div><label for="dishCategory">分类</label><input id="dishCategory" maxlength="20" value="${esc(r.category)}" list="categories"><datalist id="categories">${[...new Set(state.recipes.map(r=>r.category))].map(c=>`<option value="${esc(c)}"></option>`).join('')}</datalist></div><div><label for="dishDifficulty">难度</label><select id="dishDifficulty">${['简单','适中','挑战'].map(d=>`<option ${r.difficulty===d?'selected':''}>${d}</option>`).join('')}</select></div></div><label for="dishIngredients">主要食材（选填）</label><input id="dishIngredients" maxlength="200" value="${esc(r.ingredients)}" placeholder="鸡翅、可乐、姜"><label for="dishNote">口味 / 一句话介绍（选填）</label><textarea id="dishNote" maxlength="160" placeholder="甜咸入味，最适合拌饭">${esc(r.note)}</textarea>${actions('saveRecipe','保存菜品')}${id?'<button class="text-btn danger" data-action="deleteRecipeAsk">删除这道菜</button>':''}`)}
async function compressPhoto(source){const url=typeof source==='string'?source:URL.createObjectURL(source);try{if(typeof source!=='string'&&source.size>25*1024*1024)throw new Error('照片超过 25 MB，请换一张较小的');const img=new Image();img.src=url;await img.decode();const ratio=Math.min(1,760/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*ratio));c.height=Math.max(1,Math.round(img.height*ratio));const ctx=c.getContext('2d');if(!ctx)throw new Error('当前环境无法处理照片');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);let data=c.toDataURL('image/jpeg',.68);if(data.length>700000)data=c.toDataURL('image/jpeg',.42);if(data.length>700000)throw new Error('照片仍然太大，请换一张');return data}catch(e){throw new Error(e.message||'照片无法读取，请尝试 JPG 或 PNG')}finally{if(typeof source!=='string')URL.revokeObjectURL(url)}}
async function setPhoto(source){if(!source||!ui.editing)return;const target=ui.editing;try{const data=await compressPhoto(source);if(ui.editing!==target)return;target.photo=data;$('editPhoto').innerHTML=`<img src="${esc(data)}" alt="待保存的菜品照片">`;toast('照片已就绪，点击保存菜品后生效')}catch(e){modalError(e.message)}}
function backup(){return JSON.stringify({format:'family-menu',exportedAt:new Date().toISOString(),...state},null,2)}
function download(text,name){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
async function exportBackup(){await queue;const body=backup();if(window.FAMILY_NATIVE)await native('export',{text:body,name:'家庭菜单备份-'+new Date().toISOString().slice(0,10)+'.json'});else download(body,'家庭菜单备份-'+new Date().toISOString().slice(0,10)+'.json');toast('请把备份文件保存好，其中包含你的菜品照片')}
async function receiveImport(raw){try{if(typeof raw!=='string'||raw.length>50*1024*1024)throw new Error('备份过大或格式不正确');const incoming=Core.validate(JSON.parse(raw));showModal(`<h2>恢复这份备份？</h2><p>包含 ${incoming.recipes.length} 道菜、${incoming.members.length} 位家人、${incoming.history.length} 顿历史菜单。</p><p class="tip">恢复会替换当前本机数据。建议先导出当前备份。</p>${actions('doImport','恢复备份')}`);ui.pendingImport=incoming}catch(e){toast(e.message||'无法读取这份备份')}}
async function copyMenu(m){const text=m.title+'\n'+m.final.map((r,i)=>(i+1)+'. '+r.name).join('\n');if(window.FAMILY_NATIVE){await native('copy',{text});toast('菜单文字已复制，可以自行粘贴到微信群')}else{try{await navigator.clipboard.writeText(text);toast('菜单文字已复制')}catch{showModal(`<h2>菜单文字</h2><p class="tip">长按选择下方文字进行复制。</p><textarea class="copy-text" readonly>${esc(text)}</textarea><div class="dialog-actions"><button class="primary" data-action="close">完成</button></div>`)}}}
document.addEventListener('click',async event=>{
 const button=event.target.closest('button[data-action]');if(!button||button.disabled)return;const a=button.dataset.action,id=button.dataset.id;
 const exclusive=['doStart','addPerson','submit','confirm','finish','saveRecipe','deleteRecipe','export','import','doImport','pickPhoto','copyMenu','copyHistory'].includes(a);
 if(exclusive){if(inFlightActions.has(a))return;inFlightActions.add(a);button.disabled=true}
 try{switch(a){
 case'tab':ui.tab=button.dataset.tab;ui.finalIds=null;render();window.scrollTo(0,0);break;
 case'category':ui.category=button.dataset.category;render();break;
 case'close':closeModal();break;
 case'start':startDialog();break;
 case'doStart':if(await commit({type:'start',title:$('mealTitle').value})){closeModal();ui.tab='menu';ui.finalIds=null;render();toast('开始啦，把手机递给第一位家人吧')}break;
 case'person':personDialog();break;
 case'choosePerson':ui.person=id;closeModal();render();window.scrollTo(0,0);break;
 case'addPerson':{const memberId=Core.uid(),name=$('newPerson').value;if(await commit({type:'addMember',id:memberId,name})){ui.person=memberId;closeModal();render();window.scrollTo(0,0)}break}
 case'dish':if(!state.active)toast('先点击“开始点菜”，再选择想吃的菜');else if(state.active.phase==='confirmed')toast('最终菜单已确定，可在“本顿饭”由主厨调整');else await commit({type:'toggle',memberId:currentPerson().id,dishId:id});break;
 case'submit':if(await commit({type:'submit',memberId:currentPerson().id})){toast('这份选择已保存，把手机递给下一位吧');personDialog()}break;
 case'finalDish':ui.finalIds=ui.finalIds.includes(id)?ui.finalIds.filter(x=>x!==id):[...ui.finalIds,id];render();break;
 case'confirm':if(await commit({type:'confirm',ids:ui.finalIds})){toast('最终菜单已保存');window.scrollTo(0,0)}break;
 case'finishAsk':showModal(`<h2>这顿饭结束了吗？</h2><p>最终的 ${state.active.final.length} 道菜会保存到历史，再开始下一顿饭。</p>${actions('finish','保存并结束')}`);break;
 case'finish':if(await commit({type:'finish'})){closeModal();ui.tab='history';ui.finalIds=null;render();toast('这顿家常味，已经记下了')}break;
 case'editRecipe':editDialog(id);break;
 case'pickPhoto':if(window.FAMILY_NATIVE)await setPhoto(await native('photo',{}));else $('photoInput').click();break;
 case'removePhoto':ui.editing.photo='';$('editPhoto').textContent='🥢';break;
 case'saveRecipe':{const recipe={...ui.editing,name:$('dishName').value,category:$('dishCategory').value||'家常菜',ingredients:$('dishIngredients').value,note:$('dishNote').value,difficulty:$('dishDifficulty').value};if(await commit({type:'saveRecipe',recipe})){closeModal();ui.category='全部';render();toast('拿手菜已保存')}break}
 case'deleteRecipeAsk':{const target=ui.editing;showModal(`<h2>删除“${esc(target.name)}”？</h2><p class="tip">过去已经结束的菜单仍会保留当时的菜名。</p>${actions('deleteRecipe','删除菜品')}`);ui.editing=target;break}
 case'deleteRecipe':if(await commit({type:'deleteRecipe',id:ui.editing.id})){closeModal();render();toast('菜品已删除')}break;
 case'export':await exportBackup();break;
 case'import':if(window.FAMILY_NATIVE){const raw=await native('import',{});if(raw)await receiveImport(raw)}else $('importInput').click();break;
 case'doImport':{const incoming=ui.pendingImport;if(!incoming)throw new Error('请重新选择备份');await queue;await save(incoming);state=incoming;fatal='';ui.person=state.members[0].id;ui.tab='library';ui.finalIds=null;ui.pendingImport=null;closeModal();render();toast('备份已恢复');break}
 case'copyMenu':await copyMenu(state.active);break;
 case'copyHistory':await copyMenu(state.history.find(m=>m.id===id));break;
 }
 }catch(e){modalError(e.message||'操作未完成，请重试')}
 finally{if(exclusive){inFlightActions.delete(a);if(button.isConnected)button.disabled=false}}
});
document.addEventListener('input',event=>{if(event.target.id==='search'){ui.search=event.target.value;if($('dishGrid'))$('dishGrid').innerHTML=grid()}});
$('photoInput').addEventListener('change',async e=>{await setPhoto(e.target.files[0]);e.target.value=''});
$('importInput').addEventListener('change',async e=>{const f=e.target.files[0];if(f){if(f.size>50*1024*1024)toast('备份超过 50 MB，无法导入');else await receiveImport(await f.text())}e.target.value=''});
$('modal').addEventListener('cancel',()=>{ui.editing=null});
(async()=>{try{adapter=window.FAMILY_NATIVE?{get:async()=>window.FAMILY_INITIAL,put:async data=>native('save',{data})}:await browserStore();rawLoaded=await adapter.get();state=rawLoaded?Core.validate(rawLoaded):Core.initial();ui.person=state.members[0].id;if(!rawLoaded)await save(state);else saveLabel='已读取'+(window.FAMILY_NATIVE?'此 iPhone':'此浏览器')+'的存档';render()}catch(e){state=Core.initial();fatal=e.message||'无法读取本机存档';saveLabel='存档尚未覆盖';render()}})();
</script></body></html>
